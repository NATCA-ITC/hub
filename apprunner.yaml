version: 1.0
runtime: nodejs18
build:
  commands:
    pre-build:
      - echo "//npm.pkg.github.com/:_authToken=${NPM_TOKEN}" >> .npmrc
    build:
      - npm ci --legacy-peer-deps
      - npm run build
run:
  command: npm start
  network:
    port: 1301
    env: PORT
  env:
    - name: NODE_ENV
      value: "production"
    - name: PORT
      value: "1301"
