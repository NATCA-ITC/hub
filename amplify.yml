version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "@natca-itc:registry=https://npm.pkg.github.com" > .npmrc
        - echo "//npm.pkg.github.com/:_authToken=${NPM_TOKEN}" >> .npmrc
        - npm ci --legacy-peer-deps
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
  customHeaders:
    - pattern: '**/*'
      headers:
        - key: X-Frame-Options
          value: DENY
        - key: X-Content-Type-Options
          value: nosniff
        - key: Referrer-Policy
          value: strict-origin-when-cross-origin
